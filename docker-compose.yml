name: e-coop-voting

services:
  db:
    image: postgres:16.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: acedb25
      POSTGRES_DB: ace-system
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
